# OpenPlan self-hosted ODM processing worker + NodeODM, in one command:
#
#     docker compose up -d --build
#
# Two services. You never talk to NodeODM directly — the worker wraps it and
# speaks OpenPlan's aerial processing contract on port 8484.
#
# NETWORKING, STATED PLAINLY because every failure here is silent otherwise:
# the worker runs with `network_mode: host` so that links which say
# "localhost" or "127.0.0.1" — the signed photo URLs a local Supabase mints,
# and the app's http://localhost:3000 callback URL — reach the MACHINE, not
# the inside of a container where nothing is listening. On Linux this works
# as-is. On Docker Desktop (macOS/Windows) enable "host networking" in
# Settings → Resources → Network, or, if your Supabase and OpenPlan are
# hosted (https URLs), delete the network_mode line and publish the port
# instead (see the commented alternative).
#
# NodeODM stays on the default bridge network with its port published to the
# host, which is how the host-networked worker reaches it at localhost:3001.

services:
  nodeodm:
    image: opendronemap/nodeodm
    restart: unless-stopped
    ports:
      - "3001:3000"
    # Photogrammetry is memory-hungry. Give Docker as much RAM as you can
    # spare; a 200-photo mission wants 8 GB or more. NodeODM itself reports
    # what it has at http://localhost:3001/info.

  odm-worker:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      # The worker listens on this port ON THE HOST (host networking).
      ODM_WORKER_PORT: "8484"
      # NodeODM as seen from the host, via the published port above.
      NODEODM_URL: "http://localhost:3001"
      # The base of the artifact links this worker issues. The OpenPlan
      # deployment must be able to fetch them; for an app on the same
      # machine, localhost is exactly right.
      ODM_WORKER_PUBLIC_URL: "http://localhost:8484"
      # Both bearer tokens come from your .env file (same directory), never
      # from this file. See DEPLOY.md step 2.
      OPENPLAN_AERIAL_PROCESSING_WORKER_TOKEN: "${OPENPLAN_AERIAL_PROCESSING_WORKER_TOKEN}"
      OPENPLAN_AERIAL_PROCESSING_CALLBACK_BEARER_TOKEN: "${OPENPLAN_AERIAL_PROCESSING_CALLBACK_BEARER_TOKEN}"
    depends_on:
      - nodeodm

# Bridge-network alternative for the worker (hosted Supabase + hosted app,
# where every URL is a public https one): replace `network_mode: host` with
#
#     ports:
#       - "8484:8484"
#     environment:
#       NODEODM_URL: "http://nodeodm:3000"
#       ...
#
# and set ODM_WORKER_PUBLIC_URL to the URL your OpenPlan deployment can reach
# this machine at.
