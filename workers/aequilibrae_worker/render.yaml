# OpenPlan modeling worker — one-click deploy to Render.
#
# ============================================================ WHAT THIS IS FOR
#
# OpenPlan's posture is SELF-HOST FIRST: there is no hosted worker, and there is
# no plan for one. An agency that wants modeling runs the worker itself. That is
# a deliberate choice, not a gap — but it only works if standing one up is a
# button rather than a project, and until this file existed it was a project.
#
# Render is the target because its Blueprint format deploys a Dockerfile from a
# repository with no build configuration of your own, and because its free tier
# is enough to see whether the modeling lane is useful to you before spending
# anything.
#
# ================================================== OPENPLAN WORKS WITHOUT THIS
#
# Every other module — engagement, grants, RTP, projects, safety, transit,
# Title VI — works with no worker at all, and the modeling lane REFUSES honestly
# rather than queueing a run nothing will execute. Deploy this when you want
# travel-model runs, not to make OpenPlan function.
#
# ============================================================== HOW TO USE IT
#
#   1. Fork or clone the OpenPlan repository to your own GitHub account.
#   2. In Render: New → Blueprint, and point it at your fork.
#   3. Render reads this file and asks you for the four values marked `sync:
#      false` below. Nothing is created until you supply them.
#   4. Deploy, then copy the service's URL into OpenPlan's
#      OPENPLAN_MODELING_WORKER_URL, and the SAME token into
#      OPENPLAN_MODELING_WORKER_TOKEN.
#   5. Run `npm run doctor` in OpenPlan. It probes /healthz and tells you
#      whether the worker actually answered — which is the only way to tell a
#      working deployment from a wrong URL, because both look identical from
#      inside the app: a run that sits queued.
#
# ==================================== WHY PUSH MODE, AND WHY A TOKEN IS FORCED
#
# `push` means the worker sleeps until OpenPlan calls it, so a free instance
# costs nothing between runs. The trade is a cold start of up to a minute on the
# first run after idle — `npm run doctor` says so rather than letting it read as
# a broken deployment.
#
# The worker REFUSES TO START in push mode with no token, deliberately: an
# unauthenticated trigger endpoint on the public internet lets anyone spend your
# compute. Render generates one below, so there is no step where you might skip
# it. Copy the generated value into OpenPlan's OPENPLAN_MODELING_WORKER_TOKEN —
# the two must match exactly or every run is rejected.

services:
  - type: web
    name: openplan-modeling-worker
    runtime: docker
    dockerfilePath: ./workers/aequilibrae_worker/Dockerfile
    dockerContext: ./workers/aequilibrae_worker
    plan: free
    # /healthz is the worker's own health path (TRIGGER_HEALTH_PATH in main.py).
    # Render polls it to decide whether a deploy succeeded, so a worker that
    # cannot import its modules fails the deploy instead of going live broken.
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      # ---- How the worker gets work -------------------------------------
      # `push`: OpenPlan calls it, it sleeps otherwise. Change to `poll` to have
      # it read queued runs out of Supabase on a timer instead — that needs an
      # always-on instance (not the free plan) and no URL in OpenPlan.
      - key: AEQ_WORKER_MODE
        value: push

      # ---- Your Supabase project ----------------------------------------
      # The worker writes results straight into your database, so it needs the
      # SERVICE ROLE key, not the anon key. Treat it like a password: anyone
      # holding it can read and write every row, bypassing row-level security.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ---- The shared secret between OpenPlan and this worker ------------
      # Generated by Render so it cannot be skipped or left weak. Copy the value
      # Render shows into OpenPlan's OPENPLAN_MODELING_WORKER_TOKEN.
      - key: OPENPLAN_MODELING_WORKER_TOKEN
        generateValue: true

      # ---- Census API key (optional, and worth setting) ------------------
      # Without it the Census API rate-limits an unauthenticated caller hard, so
      # a run that needs demographics may fail part way through rather than
      # cleanly. Free, issued in minutes: https://api.census.gov/data/key_signup.html
      - key: CENSUS_API_KEY
        sync: false

      # ---- Sizing -------------------------------------------------------
      # The free instance has limited memory. These keep a large county from
      # being attempted and failing at the end of a long run rather than
      # refusing at the start. Raise them on a paid instance.
      - key: AEQ_MAX_ZONES
        value: "1200"
      - key: AEQ_CORES
        value: "1"
