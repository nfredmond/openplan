name: Production Health

# Optional manual check. Hosted operation is deferred as of September 7, 2026.
# Polls an explicitly configured deployment's /api/health. OpenPlan has no canonical
# hosted instance, so the URL comes from the repository variable
# OPENPLAN_HEALTH_URL (Settings -> Secrets and variables -> Actions ->
# Variables). When the variable is unset — every fresh fork — the job is
# skipped instead of failing or polling somebody else's deployment.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: health check
    runs-on: ubuntu-latest
    if: ${{ vars.OPENPLAN_HEALTH_URL != '' }}
    env:
      OPENPLAN_HEALTH_URL: ${{ vars.OPENPLAN_HEALTH_URL }}
    defaults:
      run:
        working-directory: ./openplan
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check production health
        run: node scripts/ops/check-prod-health.mjs
