name: Production Health

# Polls an explicitly configured deployment's /api/health every 30 minutes and on
# demand. The hosted installation (live since October 11, 2026) sets the
# repository variable OPENPLAN_HEALTH_URL (Settings -> Secrets and variables ->
# Actions -> Variables). A failed scheduled run is GitHub's alert: it emails the
# repository owner. When the variable is unset, as in a fresh fork, the job is
# skipped instead of failing or polling somebody else's deployment.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

jobs:
  health:
    name: health check
    runs-on: ubuntu-latest
    if: ${{ vars.OPENPLAN_HEALTH_URL != '' }}
    env:
      OPENPLAN_HEALTH_URL: ${{ vars.OPENPLAN_HEALTH_URL }}
    defaults:
      run:
        working-directory: ./openplan
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check production health
        run: node scripts/ops/check-prod-health.mjs
