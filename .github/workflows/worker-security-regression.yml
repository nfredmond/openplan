name: Worker security and cancellation
on:
  push:
    branches: [main]
  # Stacked PRs need the same checks before their base reaches main.
  pull_request: {}
permissions:
  contents: read
jobs:
  focused-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Wrapper tests import the worker, matching the lightweight worker CI dependencies.
      - run: pip install flask requests python-dotenv shapely "numpy<2.1" pandas
      - name: HTTP, runtime, process-tree and directional regressions
        run: |
          python -B workers/activitysim_worker/test_http_security.py
          python -B -m unittest discover -s workers/activitysim_worker/tests -p 'test_*.py'
          python -B workers/county_onramp_worker/tests/test_main.py
          python -B workers/county_onramp_worker/tests/test_process_cancellation.py
          python -B scripts/modeling/tests/test_validation_instrument_v2.py
          python -B scripts/modeling/tests/test_validation_output_alias.py
          python -B scripts/modeling/tests/test_validation_input_custody.py
          python -B scripts/modeling/tests/test_validation_source_records.py
          python -B scripts/modeling/tests/test_validation_bundle_identity.py
          python -B scripts/modeling/tests/test_validation_readiness_records.py
          python -B scripts/modeling/tests/test_validation_output_identity.py
          python -B scripts/modeling/tests/test_structural_preparation_files.py
          python -B scripts/modeling/tests/test_validation_prepared_context.py
          python -B workers/aequilibrae_worker/test_model_validation_source_catalog.py
          python -B workers/aequilibrae_worker/test_model_validation_source_files.py
          python -B workers/aequilibrae_worker/test_immutable_upload_recovery.py
          python -B workers/aequilibrae_worker/test_activity_managed_dispatch.py
          python -B scripts/modeling/tests/test_directional_refusal.py
      - name: Harmless controls and targeted fault checks
        run: python -B workers/science_regression_mutations.py
