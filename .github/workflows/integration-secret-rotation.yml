name: Integration secret rotation
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  integration-secret-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openplan/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        working-directory: openplan
        run: npm ci
      - name: Retained ciphertext and credential rotation controls
        run: python3 -B docs/reviews/2026-10-15-integration-secret-rotation/verify_controls.py --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/integration-secret-rotation"
