name: Aerial worker custody regression
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  odm-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight worker dependencies
        run: python3 -m pip install requests pyproj python-dotenv
      - name: All aerial worker suites
        run: |
          set -eu
          for suite in workers/odm_worker/test_*.py; do
            python3 -B "$suite"
          done
      - name: Journal harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-admission-journal/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-admission-journal-controls"
      - name: Disconnected journal root capture and replay
        run: |
          python3 -B docs/reviews/2026-10-11-odm-admission-journal/native_recovery.py \
            --out "$RUNNER_TEMP/odm-admission-journal-native"
      - name: Source custody harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-source-custody/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-source-custody-controls"
      - name: Interrupted source copy and stopped-root recovery
        run: |
          python3 -B docs/reviews/2026-10-11-odm-source-custody/native_recovery.py \
            --out "$RUNNER_TEMP/odm-source-custody-native"
      - name: Engine effect harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-engine-effects/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-engine-effects-controls"
      - name: Disconnected engine effect root capture and replay
        run: |
          python3 -B docs/reviews/2026-10-11-odm-engine-effects/native_recovery.py \
            --out "$RUNNER_TEMP/odm-engine-effects-native"
      - name: Captured draft harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-draft-custody/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-draft-custody-controls"
      - name: ZIP derived source harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-zip-derived-custody/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-zip-derived-controls"
      - name: Interrupted ZIP image copy and stopped-root recovery
        run: |
          python3 -B docs/reviews/2026-10-11-odm-zip-derived-custody/native_recovery.py \
            --out "$RUNNER_TEMP/odm-zip-derived-native"
      - name: ZIP engine lineage harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-zip-engine-integration/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-zip-engine-controls"
      - name: Original ZIP engine stopped-root replay
        run: |
          python3 -B docs/reviews/2026-10-11-odm-zip-engine-integration/native_recovery.py \
            --out "$RUNNER_TEMP/odm-zip-engine-native"
      - name: Durable HTTP admission harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-runtime-admission/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-runtime-admission-controls"
      - name: Actual HTTP admission and stopped-root held-start recovery
        run: |
          python3 -B docs/reviews/2026-10-11-odm-runtime-admission/native_recovery.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-runtime-admission-native"
      - name: Owned runtime preparation harmless and targeted fault controls
        run: |
          python3 -B docs/reviews/2026-10-11-odm-runtime-preparation/verify_controls.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/odm-runtime-preparation-controls"
      - name: Interrupted owned runtime preparation and stopped-root recovery
        run: |
          python3 -B docs/reviews/2026-10-11-odm-runtime-preparation/native_recovery.py \
            --out "$RUNNER_TEMP/odm-runtime-preparation-native"
