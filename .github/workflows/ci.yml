name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify (qa gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./openplan
    steps:
      - uses: actions/checkout@v6
        with:
          # The active-roadmap guard verifies the commit at which the queue was
          # reviewed. A one-commit checkout makes that evidence unknowable.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openplan/package-lock.json

      - name: Install
        run: npm ci

      - name: QA gate
        run: npm run qa:gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-key

  order-independence:
    name: order independence (shuffled vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./openplan
    steps:
      - uses: actions/checkout@v6
        with:
          # Shuffled order still runs the roadmap guard, so it needs the same
          # history as the filename-order gate above.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openplan/package-lock.json

      - name: Install
        run: npm ci

      # The qa gate above always walks test files in the same order, so it
      # cannot see a test that depends on another test having run first. Vitest
      # reuses a worker process across files: a stubbed global, a stubbed env
      # var, or a queued `mockResolvedValueOnce` that the code under test never
      # consumed is inherited by whatever file runs next. Eight such defects
      # were found on 2026-08-21/22, each green in file-name order.
      #
      # The seed is random per run, ON PURPOSE. A fixed seed pins one order and
      # would go permanently green against the one arrangement it happened to
      # pick, which is the same blindness as not shuffling at all. A failure
      # here is a real defect, never a flake, and the script prints the seed
      # that produced it so the order can be replayed exactly.
      - name: Shuffled suite
        run: npm run test:shuffled
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
          ANTHROPIC_API_KEY: ci-placeholder-anthropic-key

  modeling-script-tests:
    name: modeling scripts (python unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scripts/modeling/tests
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # NONE of these suites ran in CI until 2026-08-18. The worker job above
      # globs `workers/aequilibrae_worker/test_*.py` and stops there, so the
      # county-script lane's 39 suites — count validation, the carriageway
      # pairing, shared-link resolution, the pre-registered gamma criteria,
      # population synthesis, ActivitySim inputs — were only ever run by
      # whoever happened to run them locally. A guard nobody runs is a
      # convention.
      #
      # Same lightweight posture as the worker job: no aequilibrae. geopandas
      # and openmatrix are here because screening_runtime and the ActivitySim
      # input builder and national FAF router import them at module level —
      # verified in a clean venv with exactly this list. 44 of 45 suites run;
      # the one explicit exclusion below imports aequilibrae.
      - name: Install test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-mod-spatialite
          pip install "numpy<2.1" pandas scipy shapely requests python-dotenv geopandas openmatrix pytest

      # `|| exit 1`, not `|| break`: break leaves the loop with status 0, which
      # would turn a failing suite into a green job. The floor catches a broken
      # glob, which is how the worker job silently ran five of twenty for months.
      - name: Unit tests (all suites the lightweight env can run)
        run: |
          set -u
          count=0
          for f in test_*.py; do
            case "$f" in
              test_reuse_network_from_run.py)
                echo "=== $f SKIPPED: imports the aequilibrae engine, which this job deliberately does not install"
                continue
                ;;
            esac
            echo "=== $f"
            python "$f" || exit 1
            count=$((count + 1))
          done
          echo "ran $count suites"
          test "$count" -ge 40 || { echo "expected at least 40 suites, found $count — the glob broke"; exit 1; }

  ops-script-tests:
    name: ops scripts (python unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./openplan/scripts/ops/tests
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # STDLIB ONLY, deliberately. The control panel itself imports tkinter,
      # which is why the rule these suites exercise was moved into
      # `scripts/ops/check_status.py` — a module with no GUI import. A test that
      # needed a display would be a test that never ran here.
      - name: Unit tests
        run: |
          set -u
          count=0
          for f in test_*.py; do
            echo "=== $f"
            python "$f" || exit 1
            count=$((count + 1))
          done
          echo "ran $count suites"
          test "$count" -ge 1 || { echo "expected at least 1 suite, found $count — the glob broke"; exit 1; }

  worker-tests:
    name: worker (python unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workers/aequilibrae_worker
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Lightweight deps only — the modeling unit tests do NOT import aequilibrae
      # (that heavy engine stays a local/deploy concern). This guards the pure
      # demand logic: LODES OD, resident VMT, OD-matrix blend, mode choice, GTFS.
      # python-dotenv is here because four suites import main.py, whose module
      # level imports it — verified in a clean venv with exactly this list.
      - name: Install test deps
        run: pip install "numpy<2.1" pandas shapely requests python-dotenv

      - name: Syntax check
        run: python -m py_compile *.py

      # EVERY test_*.py, discovered by glob — never a hardcoded list. This job
      # named five files for months while the directory grew to twenty, so
      # calibration, count validation, convergence and twelve more suites never
      # ran here (found 2026-08-04, Stage B audit). `|| exit 1`, not the
      # documented interactive `|| break`: `break` leaves the loop with status
      # 0, which would turn a failing suite into a green job.
      #
      # AequilibraE itself stays out of this job. `main.py` defers that import
      # until an engine stage runs, so every pure worker suite can run here;
      # there is no exclusion list for a new suite to fall outside silently.
      - name: Unit tests (all lightweight suites)
        run: |
          set -u
          count=0
          for f in test_*.py; do
            echo "=== $f"
            python "$f" || exit 1
            count=$((count + 1))
          done
          echo "ran $count suites"
          test "$count" -ge 28 || { echo "expected at least 28 suites, found $count — the glob broke"; exit 1; }
