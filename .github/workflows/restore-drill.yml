name: Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 1 */3 *"
  pull_request:
    paths:
      - "openplan/scripts/ops/disposable-restore-drill.sh"
      - "openplan/scripts/ops/*restore*.py"
      - "openplan/scripts/ops/seed-owp-restore.ts"
      - "openplan/scripts/ops/tests/test_*restore*.py"
      - "openplan/scripts/ops/tests/fixtures/owp-recovery.json"
      - "openplan/src/test/local-supabase-env.ts"
      - "openplan/supabase/migrations/**"
      - ".github/workflows/restore-drill.yml"

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: openplan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openplan/package-lock.json
      - run: npm ci
      - run: python3 -B -m unittest discover -s scripts/ops/tests -p 'test_*restore*.py'
      - run: npm run ops:restore-drill -- --full-archive
        env:
          OPENPLAN_RESTORE_EVIDENCE_DIR: ${{ runner.temp }}/openplan-restore-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-restore-custody
          path: ${{ runner.temp }}/openplan-restore-evidence/
          if-no-files-found: ignore
          retention-days: 14
