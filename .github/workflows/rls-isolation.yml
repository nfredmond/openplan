name: RLS Isolation

# PR-blocking since 2026-08-04 (Stage B): the live RLS proof ran only nightly,
# so a policy regression merged in the morning sat exposed until the next
# 10:23 UTC run told someone. The headless-Supabase recipe below is the same
# one the nightly upgrade-path job has been proving works in CI.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Stacked PRs need the same checks before their base reaches main.
  pull_request: {}
  schedule:
    - cron: "23 10 * * *"

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Every other run, including each push to main, gets
# a group of its own and is never cancelled or queued: Vercel waits on main's
# checks before it promotes a deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rls-isolation:
    name: live RLS isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./openplan
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openplan/package-lock.json

      - name: Install
        run: npm ci

      - name: Start Supabase
        run: npm exec -- supabase start --workdir "${{ github.workspace }}/openplan"

      - name: Reset local database
        run: npm exec -- supabase db reset --workdir "${{ github.workspace }}/openplan"

      - name: Run live RLS isolation proof
        env:
          OPENPLAN_CHAT_NATIVE_FIXTURE: '1'
          OPENPLAN_SUPABASE_WORKDIR: '${{ github.workspace }}/openplan'
        run: npm run test:rls-live

      - name: Stop Supabase
        if: always()
        run: npm exec -- supabase stop --workdir "${{ github.workspace }}/openplan"
