name: RLS Isolation

# PR-blocking since 2026-08-04 (Stage B): the live RLS proof ran only nightly,
# so a policy regression merged in the morning sat exposed until the next
# 10:23 UTC run told someone. The headless-Supabase recipe below is the same
# one the nightly upgrade-path job has been proving works in CI.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 10 * * *"

jobs:
  rls-isolation:
    name: live RLS isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./openplan
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openplan/package-lock.json

      - name: Install
        run: npm ci

      - name: Start Supabase
        run: npm exec -- supabase start

      - name: Reset local database
        run: npm exec -- supabase db reset

      - name: Run live RLS isolation proof
        run: npm run test:rls-live

      - name: Stop Supabase
        if: always()
        run: npm exec -- supabase stop
