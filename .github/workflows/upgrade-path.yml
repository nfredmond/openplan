# Rehearses the one operation every self-hosted deployment performs on every
# upgrade and that nothing else ever tests: applying HEAD's migrations onto a
# POPULATED database built by the previous release. `db reset` on an empty
# database (the ci/rls jobs) cannot catch a migration that only fails against
# existing rows — and "data safe across upgrades" is the project's own 1.0
# criterion, so it gets rehearsed nightly rather than asserted.
name: Upgrade Path

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Release tag to upgrade from; blank selects the newest release before HEAD"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "openplan/supabase/migrations/**"
      - ".github/workflows/upgrade-path.yml"
  schedule:
    - cron: "47 10 * * *"

jobs:
  upgrade-in-place:
    name: previous release -> seed -> HEAD migration up
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./openplan
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need tags and history to check out the previous release

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openplan/package-lock.json

      - name: Resolve previous release tag
        id: prev
        run: |
          REQUESTED_BASE="${{ inputs.base_tag }}"
          if [ -n "$REQUESTED_BASE" ]; then
            git -C .. show-ref --verify --quiet "refs/tags/$REQUESTED_BASE" || {
              echo "::error::Requested base tag does not exist: $REQUESTED_BASE"
              exit 1
            }
            TAG="$REQUESTED_BASE"
          else
            TAG=""
            while IFS= read -r CANDIDATE; do
              if [[ "$CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                TAG="$CANDIDATE"
                break
              fi
            done < <(git -C .. tag --merged "${GITHUB_SHA}^" --sort=-version:refname)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag before HEAD was found"
            exit 1
          fi
          git -C .. merge-base --is-ancestor "$TAG^{commit}" "$GITHUB_SHA" || {
            echo "::error::Base tag $TAG is not an ancestor of $GITHUB_SHA"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Rehearsing upgrade from $TAG to $GITHUB_SHA"

      - name: Check out the previous release
        run: git -C .. checkout "${{ steps.prev.outputs.tag }}"

      - name: Install (previous release)
        run: npm ci

      - name: Start Supabase and apply the previous release's migrations
        run: |
          npm exec -- supabase start
          npm exec -- supabase db reset

      - name: Seed representative workspace data
        run: |
          CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          # `docker exec` WITHOUT -i does not attach stdin, so this heredoc never
          # reached psql: it read nothing, printed nothing, and exited 0. The seed
          # silently inserted zero rows on every run of this job, which the row
          # counts below then compared as 0:0:0 -> 0:0:0 and called a pass. The
          # flag is the whole fix; the non-empty assertion below is what stops it
          # from ever being vacuous again.
          docker exec -i "$CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          -- A workspace with a member-shaped row and rows in high-stakes tables,
          -- so a migration that rewrites or drops data has something to destroy.
          INSERT INTO auth.users (id, email) VALUES ('00000000-0000-4000-8000-000000000001', 'upgrade-probe@example.com');
          INSERT INTO workspaces (id, name, slug) VALUES ('00000000-0000-4000-8000-00000000000a', 'Upgrade Probe Workspace', 'upgrade-probe');
          INSERT INTO workspace_members (workspace_id, user_id, role)
            VALUES ('00000000-0000-4000-8000-00000000000a', '00000000-0000-4000-8000-000000000001', 'owner');
          INSERT INTO projects (id, workspace_id, name)
            VALUES ('00000000-0000-4000-8000-00000000000b', '00000000-0000-4000-8000-00000000000a', 'Upgrade Probe Project');
          INSERT INTO kb_documents (
            id, workspace_id, project_id, uploaded_by, title, doc_kind, source_kind,
            original_filename, content_type, byte_size, storage_ref, checksum, status
          ) VALUES (
            '00000000-0000-4000-8000-00000000000d',
            '00000000-0000-4000-8000-00000000000a',
            '00000000-0000-4000-8000-00000000000b',
            '00000000-0000-4000-8000-000000000001',
            'Upgrade evidence', 'prior_study', 'uploaded_txt', 'upgrade-evidence.txt',
            'text/plain', 24,
            'storage://kb-documents/00000000-0000-4000-8000-00000000000a/00000000-0000-4000-8000-00000000000d/upgrade-evidence.txt',
            repeat('a', 64), 'ready'
          );
          INSERT INTO reports (id, workspace_id, project_id, title, report_type, status, created_by)
            VALUES (
              '00000000-0000-4000-8000-00000000000f',
              '00000000-0000-4000-8000-00000000000a',
              '00000000-0000-4000-8000-00000000000b',
              'Upgrade Evidence Report', 'analysis_summary', 'generated',
              '00000000-0000-4000-8000-000000000001'
            );
          INSERT INTO report_artifacts (id, report_id, artifact_kind, storage_path, generated_by, metadata_json)
            VALUES (
              '00000000-0000-4000-8000-000000000010',
              '00000000-0000-4000-8000-00000000000f', 'html',
              '00000000-0000-4000-8000-00000000000a/upgrade-evidence.html',
              '00000000-0000-4000-8000-000000000001',
              jsonb_build_object('evidenceCustody', jsonb_build_object('sha256', repeat('a', 64), 'documentId', '00000000-0000-4000-8000-00000000000d'))
            );
          INSERT INTO aerial_missions (id, workspace_id, project_id, title, status)
            VALUES (
              '00000000-0000-4000-8000-000000000011',
              '00000000-0000-4000-8000-00000000000a',
              '00000000-0000-4000-8000-00000000000b',
              'Upgrade custody mission', 'complete'
            );
          INSERT INTO aerial_processing_jobs (
            id, workspace_id, project_id, mission_id, request_id, status, preset_id, imagery_url, created_by
          ) VALUES (
            '00000000-0000-4000-8000-000000000012',
            '00000000-0000-4000-8000-00000000000a',
            '00000000-0000-4000-8000-00000000000b',
            '00000000-0000-4000-8000-000000000011',
            'upgrade-custody-request', 'succeeded', 'balanced', 'https://invalid.example/expired',
            '00000000-0000-4000-8000-000000000001'
          );
          INSERT INTO aerial_artifact_custody (
            id, workspace_id, mission_id, processing_job_id, kind, state,
            storage_bucket, storage_path, byte_size, checksum_sha256, content_type,
            source_host, source_expires_at, attempt_count, held_at
          ) VALUES (
            '00000000-0000-4000-8000-000000000013',
            '00000000-0000-4000-8000-00000000000a',
            '00000000-0000-4000-8000-000000000011',
            '00000000-0000-4000-8000-000000000012',
            'orthomosaic', 'held', 'aerial-artifacts',
            '00000000-0000-4000-8000-00000000000a/upgrade-custody.tif',
            24, repeat('b', 64), 'image/tiff', 'invalid.example', now() + interval '1 day', 1, now()
          );
          INSERT INTO storage.objects (id, bucket_id, name, owner, metadata)
            VALUES (
              '00000000-0000-4000-8000-000000000014', 'kb-documents',
              '00000000-0000-4000-8000-00000000000a/00000000-0000-4000-8000-00000000000d/upgrade-evidence.txt',
              '00000000-0000-4000-8000-000000000001',
              jsonb_build_object('mimetype', 'text/plain', 'size', 24, 'sha256', repeat('a', 64))
            );
          SQL

      - name: Record the seeded row counts
        run: |
          CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          docker exec "$CONTAINER" psql -U postgres -d postgres -tAc \
            "SELECT (SELECT count(*) FROM workspaces) || ':' || (SELECT count(*) FROM workspace_members) || ':' || (SELECT count(*) FROM projects) || ':' || (SELECT count(*) FROM kb_documents) || ':' || (SELECT count(*) FROM report_artifacts) || ':' || (SELECT count(*) FROM aerial_artifact_custody) || ':' || (SELECT count(*) FROM storage.objects)" \
            > /tmp/seed-counts.txt
          cat /tmp/seed-counts.txt
          # GUARD THE GUARD. Every assertion in this job compares the database
          # before and after the upgrade, and an EMPTY database satisfies all of
          # them — nothing was destroyed because nothing was there. So the probe
          # must prove it seeded something before it is allowed to conclude
          # anything about upgrade safety.
          SEEDED=$(cat /tmp/seed-counts.txt)
          case "$SEEDED" in
            0:*|*:0:*|*:0:*|*:0:*|*:0:*|*:0:*|*:0)
              echo "::error::The upgrade probe seeded no rows ($SEEDED), so it cannot prove an upgrade preserves data. Fix the seed step rather than trusting this job."
              exit 1
              ;;
          esac

      - name: Check out HEAD
        run: git -C .. checkout "$GITHUB_SHA"

      - name: Install (HEAD)
        run: npm ci

      - name: Apply HEAD's migrations onto the populated previous-release schema
        run: npm exec -- supabase migration up

      - name: Assert the seeded rows survived
        run: |
          CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          AFTER=$(docker exec "$CONTAINER" psql -U postgres -d postgres -tAc \
            "SELECT (SELECT count(*) FROM workspaces) || ':' || (SELECT count(*) FROM workspace_members) || ':' || (SELECT count(*) FROM projects) || ':' || (SELECT count(*) FROM kb_documents) || ':' || (SELECT count(*) FROM report_artifacts) || ':' || (SELECT count(*) FROM aerial_artifact_custody) || ':' || (SELECT count(*) FROM storage.objects)")
          BEFORE=$(cat /tmp/seed-counts.txt)
          echo "before=$BEFORE after=$AFTER"
          test "$BEFORE" = "$AFTER" || { echo "::error::Rows changed across the upgrade: $BEFORE -> $AFTER"; exit 1; }
          NAME=$(docker exec "$CONTAINER" psql -U postgres -d postgres -tAc \
            "SELECT name FROM projects WHERE id = '00000000-0000-4000-8000-00000000000b'")
          test "$NAME" = "Upgrade Probe Project" || { echo "::error::Seeded project content changed: '$NAME'"; exit 1; }
          CUSTODY=$(docker exec "$CONTAINER" psql -U postgres -d postgres -tAc \
            "SELECT k.checksum || ':' || (r.metadata_json #>> '{evidenceCustody,sha256}') || ':' || a.checksum_sha256 || ':' || (o.metadata->>'sha256')
             FROM kb_documents k, report_artifacts r, aerial_artifact_custody a, storage.objects o
             WHERE k.id='00000000-0000-4000-8000-00000000000d'
               AND r.id='00000000-0000-4000-8000-000000000010'
               AND a.id='00000000-0000-4000-8000-000000000013'
               AND o.id='00000000-0000-4000-8000-000000000014'")
          EXPECTED="$(printf 'a%.0s' {1..64}):$(printf 'a%.0s' {1..64}):$(printf 'b%.0s' {1..64}):$(printf 'a%.0s' {1..64})"
          test "$CUSTODY" = "$EXPECTED" || { echo "::error::Evidence custody or storage metadata changed across the upgrade"; exit 1; }

      - name: Exercise v0.32 operational rows on the upgraded database
        run: |
          CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          docker exec -i "$CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO workspace_reminder_preferences (workspace_id, advance_days, email_digest_enabled)
          VALUES ('00000000-0000-4000-8000-00000000000a', 14, false);
          INSERT INTO modeling_worker_heartbeats (
            worker_kind, instance_id, supported_stages, runtime_mode, worker_version,
            started_at, last_successful_heartbeat_at
          ) VALUES (
            'aequilibrae', 'upgrade-probe-worker',
            ARRAY['AequilibraE Setup', 'Network Assignment', 'Artifact Extraction'],
            'poll', 'upgrade-probe', now(), now()
          );
          INSERT INTO safety_crash_ingests (
            id, workspace_id, min_lon, min_lat, max_lon, max_lat, source_id, source_label,
            attribution, coverage_state, severity_completeness, status,
            published_through, published_through_provenance
          ) VALUES (
            '00000000-0000-4000-8000-000000000015',
            '00000000-0000-4000-8000-00000000000a', -121.3, 39.1, -120.0, 39.6,
            'ccrs-ca', 'Upgrade rehearsal crash source', 'Upgrade rehearsal fixture',
            'ccrs_ca_statewide', 'fatal_injury_only', 'ready',
            '2023-12-31', jsonb_build_object('basis', 'upgrade_rehearsal_fixture', 'label', 'Exact cutoff fixture')
          );
          SQL
          V032_ROWS=$(docker exec "$CONTAINER" psql -U postgres -d postgres -tAc \
            "SELECT (SELECT count(*) FROM workspace_reminder_preferences WHERE advance_days = 14 AND NOT email_digest_enabled) || ':' || (SELECT count(*) FROM modeling_worker_heartbeats WHERE instance_id = 'upgrade-probe-worker') || ':' || (SELECT count(*) FROM safety_crash_ingests WHERE published_through = DATE '2023-12-31')")
          test "$V032_ROWS" = "1:1:1" || { echo "::error::v0.32 operational rows failed on upgraded schema: $V032_ROWS"; exit 1; }

      - name: Stop Supabase
        if: always()
        run: npm exec -- supabase stop
