<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenPlan social preview</title>
  <desc id="desc">OpenPlan is free, open-source Apache-2.0 planning software for agencies, tribes, counties, cities, and consultants.</desc>
  <!-- Source for openplan-og.png. Link previews do not render SVG, so the PNG is what metadata points at. Re-render the PNG when this changes. -->
  <rect width="1200" height="630" fill="#111618"/>
  <g transform="translate(96 150)">
    <rect width="112" height="112" rx="24" fill="#111618"/>
    <circle cx="56" cy="56" r="30" stroke="#ff7a58" stroke-width="14"/>
    <circle cx="56" cy="56" r="10" fill="#6dc6b5"/>
  </g>
  <text x="236" y="238" fill="#f0ede6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2">OpenPlan</text>
  <text x="96" y="358" fill="#f0ede6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600">Free, open-source planning software</text>
  <text x="96" y="420" fill="#c4beb1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30">Maps, public comments, projects and reports in one place,</text>
  <text x="96" y="462" fill="#c4beb1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30">for agencies, tribes, counties, cities and consultants.</text>
</svg>
