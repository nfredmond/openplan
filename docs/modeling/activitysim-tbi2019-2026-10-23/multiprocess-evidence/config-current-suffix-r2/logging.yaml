logging:
  version: 1
  disable_existing_loggers: true
  root:
    level: NOTSET
    handlers:
    - console
    - logfile
  loggers:
    activitysim:
      level: INFO
      handlers:
      - console
      - logfile
      propagate: false
    orca:
      level: WARN
      handlers:
      - console
      - logfile
      propagate: false
    filelock:
      level: WARN
    sharrow:
      level: INFO
    blib2to3:
      level: WARN
    black:
      level: WARN
    activitysim.core.chunk:
      level: DEBUG
      handlers:
      - console
      - logfile
      propagate: false
  handlers:
    logfile:
      class: logging.FileHandler
      filename:
        get_log_file_path: activitysim.log
      mode: w
      formatter: fileFormatter
      level: NOTSET
    console:
      class: logging.StreamHandler
      stream: ext://sys.stdout
      formatter: elapsedFormatter
      level: NOTSET
  formatters:
    simpleFormatter:
      class: logging.Formatter
      format: '%(levelname)s - %(message)s'
      datefmt: '%d/%m/%Y %H:%M:%S'
    fileFormatter:
      class: logging.Formatter
      format: '%(asctime)s - %(levelname)s - %(name)s - %(message)s'
      datefmt: '%d/%m/%Y %H:%M:%S'
    elapsedFormatter:
      (): activitysim.core.tracing.ElapsedTimeFormatter
      format: '[{elapsedTime}] {process:d} {processName:s} {levelname:s}: {message:s}'
      style: '{'
